[project]
name = "asgikit"
description = "Toolkit for building ASGI applications and libraries"
authors = [
    {name = "Livio Ribeiro", email = "livioribeiro@outlook.com"},
]
license = {text = "MIT"}
readme = "README.md"
repository = "https://github.com/livioribeiro/asgikit"
keywords = ["asgi", "toolkit", "asyncio", "web"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dynamic = ["version"]

requires-python = ">=3.11"

dependencies = []

[project.optional-dependencies]
multipart = [
    "python-multipart~=0.0.20"
]

[dependency-groups]
dev = [
    "uvicorn[standard]~=0.34.2",
    "granian~=2.2.6",
    "mypy~=1.15.0",
    "isort~=6.0.1",
    "ruff~=0.11.10",
]

test = [
    "pytest~=8.3.5",
    "pytest-asyncio~=0.26.0",
    "coverage~=7.8.0",
    "httpx~=0.28.1",
    "asgiref~=3.8.1",
    "orjson~=3.10.18",
    "msgspec~=0.19.0"
]

[tool.hatch.version]
path = "src/asgikit/__version__.py"

[tool.hatch.build.targets.sdist]
include = ["src/asgikit"]

[tool.hatch.build.targets.wheel]
packages = ["src/asgikit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"